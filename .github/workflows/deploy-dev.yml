name: 部署开发环境

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: hnieoj-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署
    runs-on: self-hosted
    env:
      DEPLOY_DIR: /opt/hnieoj/backend
      SOURCE_DIR: /opt/hnieoj/backend/source
      COMPOSE_PROJECT_NAME: hnieoj-dev

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 检查部署环境
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          require_command() {
            command -v "$1" >/dev/null || fail "缺少命令：$1，请先在 self-hosted runner 机器安装。"
            echo "命令检查通过：$1"
          }

          require_file() {
            test -f "$1" || fail "缺少文件：$1，请按 deploy/docker/.env.example 创建并填写真实部署配置。"
            echo "文件检查通过：$1"
          }

          require_dir() {
            test -d "$1" || fail "缺少目录：$1，请先在 runner 机器创建并配置权限。"
            echo "目录检查通过：$1"
          }

          echo "Runner 用户：$(id)"
          require_command docker
          require_command rsync
          docker compose version || fail "Docker Compose v2 不可用，请安装 docker compose 插件。"
          docker info >/dev/null || fail "当前 runner 用户不能访问 Docker daemon，请检查 docker 服务和用户组权限。"
          require_file "${DEPLOY_DIR}/.env"
          mkdir -p "${SOURCE_DIR}" || fail "无法创建代码同步目录：${SOURCE_DIR}"
          require_dir /data/oj/problems
          require_dir /etc/hnieoj/judge-security

      - name: Maven 打包
        shell: bash
        run: mvn -s deploy/maven/settings.xml clean package -DskipTests

      - name: 同步部署目录
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude '.m2' \
            --exclude 'node_modules' \
            ./ "${SOURCE_DIR}/"

      - name: Docker Compose 部署
        shell: bash
        working-directory: /opt/hnieoj/backend/source
        run: |
          set -euo pipefail
          docker compose \
            -p "${COMPOSE_PROJECT_NAME}" \
            --env-file "${DEPLOY_DIR}/.env" \
            -f deploy/docker/docker-compose.dev.yml \
            up -d --build --remove-orphans

      - name: 查看容器状态
        shell: bash
        working-directory: /opt/hnieoj/backend/source
        run: docker compose -p "${COMPOSE_PROJECT_NAME}" -f deploy/docker/docker-compose.dev.yml ps
