spring:
  application:
    name: hnieoj-user
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      discovery:
        namespace: ${NACOS_NAMESPACE}
      config:
        namespace: ${NACOS_NAMESPACE}
        file-extension: yaml
  config:
    import:
      - optional:nacos:hnieoj-secrets.yaml?group=HNIEOJ_SECRET_GROUP
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP