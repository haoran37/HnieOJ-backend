spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${hnieoj.mysql.host}:${hnieoj.mysql.port}/hnieoj_judge_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${hnieoj.mysql.username}
    password: ${hnieoj.mysql.password}
  data:
    redis:
      host: ${hnieoj.redis.host}
      port: ${hnieoj.redis.port}
      password: ${hnieoj.redis.password}
  rabbitmq:
    host: ${hnieoj.rabbitmq.host}
    port: ${hnieoj.rabbitmq.port}
    username: ${hnieoj.rabbitmq.username}
    password: ${hnieoj.rabbitmq.password}
    virtual-host: ${hnieoj.rabbitmq.virtual-host}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

sa-token:
  is-print: false

hnieoj:
  judge:
    mq:
      # 判题任务 MQ 命名。生产环境如果多套 HNieOJ 共用同一个 RabbitMQ，请使用独立 vhost 或独立命名前缀。
      exchange: ${HNIEOJ_JUDGE_MQ_EXCHANGE:hnieoj.judge.exchange}
      task-queue: ${HNIEOJ_JUDGE_MQ_TASK_QUEUE:hnieoj.judge.task}
      routing-key: ${HNIEOJ_JUDGE_MQ_ROUTING_KEY:judge.submission.created}
      spj-routing-key: ${HNIEOJ_JUDGE_MQ_SPJ_ROUTING_KEY:judge.submission.spj}
      interactive-routing-key: ${HNIEOJ_JUDGE_MQ_INTERACTIVE_ROUTING_KEY:judge.submission.interactive}
      dead-letter-exchange: ${HNIEOJ_JUDGE_MQ_DLX:hnieoj.judge.dlx}
      dead-letter-queue: ${HNIEOJ_JUDGE_MQ_DLQ:hnieoj.judge.task.dlq}
      dead-letter-routing-key: ${HNIEOJ_JUDGE_MQ_DLX_ROUTING_KEY:judge.submission.created.dlq}
  submission:
    # 单次提交代码最大字节数，按 UTF-8 编码计算。
    max-code-bytes: ${HNIEOJ_SUBMISSION_MAX_CODE_BYTES:65536}
    # SPJ checker 源码最大字节数，防止判题任务消息过大。
    max-checker-bytes: ${HNIEOJ_SUBMISSION_MAX_CHECKER_BYTES:262144}
    # 交互题 interactor 源码最大字节数，防止判题任务消息过大。
    max-interactor-bytes: ${HNIEOJ_SUBMISSION_MAX_INTERACTOR_BYTES:262144}
    # 判题任务完整 MQ payload 最大字节数。
    max-message-payload-bytes: ${HNIEOJ_SUBMISSION_MAX_MESSAGE_PAYLOAD_BYTES:1048576}
    # 允许进入 MQ 的判题模式；生产启用 spj/interactive 前，判题节点必须通过心跳上报对应能力。
    supported-judge-modes: ${HNIEOJ_SUBMISSION_SUPPORTED_JUDGE_MODES:default}
    judge-outbox:
      # 判题任务 outbox 重试扫描间隔，单位毫秒。
      retry-interval-ms: ${HNIEOJ_JUDGE_OUTBOX_RETRY_INTERVAL_MS:10000}
      # 单次扫描最多处理的 outbox 数量。
      retry-batch-size: ${HNIEOJ_JUDGE_OUTBOX_RETRY_BATCH_SIZE:20}
      # 最大投递次数，超过后状态置为 exhausted，需要人工处理。
      max-retry-count: ${HNIEOJ_JUDGE_OUTBOX_MAX_RETRY_COUNT:10}
      # 每次投递失败后的下次重试间隔，单位秒。
      retry-backoff-seconds: ${HNIEOJ_JUDGE_OUTBOX_RETRY_BACKOFF_SECONDS:30}
      # processing 状态超时时间，超过后允许重新投递，单位秒。
      processing-timeout-seconds: ${HNIEOJ_JUDGE_OUTBOX_PROCESSING_TIMEOUT_SECONDS:120}
    judge-timeout:
      # 是否启用卡住提交扫描。
      enabled: ${HNIEOJ_JUDGE_TIMEOUT_ENABLED:true}
      # 扫描间隔，单位毫秒。
      scan-interval-ms: ${HNIEOJ_JUDGE_TIMEOUT_SCAN_INTERVAL_MS:60000}
      # 单次最多处理的提交数量。
      batch-size: ${HNIEOJ_JUDGE_TIMEOUT_BATCH_SIZE:100}
      # Pending 状态超时时间，单位秒。
      pending-timeout-seconds: ${HNIEOJ_JUDGE_PENDING_TIMEOUT_SECONDS:1800}
      # Compiling/Running 状态超时时间，单位秒。
      active-timeout-seconds: ${HNIEOJ_JUDGE_ACTIVE_TIMEOUT_SECONDS:1800}
      # 已投递到 RabbitMQ 但仍 Pending 的告警阈值，单位秒；不会直接终态化任务。
      sent-pending-warn-seconds: ${HNIEOJ_JUDGE_SENT_PENDING_WARN_SECONDS:3600}
    rejudge-task:
      # 批量重判任务扫描间隔，单位毫秒。
      scan-interval-ms: ${HNIEOJ_REJUDGE_TASK_SCAN_INTERVAL_MS:10000}
      # 单个任务每轮最多处理的提交数量。
      batch-size: ${HNIEOJ_REJUDGE_TASK_BATCH_SIZE:50}
      # 调度租约时长，单位秒；超过该时间未释放时允许其他实例接管。
      lease-seconds: ${HNIEOJ_REJUDGE_TASK_LEASE_SECONDS:300}
      # 处理多少条提交后刷新一次租约。
      lease-renew-every: ${HNIEOJ_REJUDGE_TASK_LEASE_RENEW_EVERY:10}
    websocket:
      # 允许订阅判题进度 WebSocket 的前端来源。生产部署后请改成真实前端域名。
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:5173"
