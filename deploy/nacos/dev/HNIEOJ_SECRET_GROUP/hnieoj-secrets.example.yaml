hnieoj:
  mysql:
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:replace_me}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:replace_me}
  internal:
    token: ${HNIEOJ_INTERNAL_TOKEN:replace_me}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:replace_me}
    virtual-host: ${RABBITMQ_VHOST:/}
  judge:
    security:
      jwt-secret: ${HNIEOJ_JUDGE_JWT_SECRET:replace_me}
    formal-token:
      # 公钥加密后的正式判题节点长期 Token。私钥建议通过环境变量或文件注入，不直接写入 Nacos。
      encrypted-token: ${HNIEOJ_JUDGE_FORMAL_TOKEN_ENCRYPTED:}
      private-key: ${HNIEOJ_JUDGE_FORMAL_TOKEN_PRIVATE_KEY:}
      private-key-path: ${HNIEOJ_JUDGE_FORMAL_TOKEN_PRIVATE_KEY_PATH:}
