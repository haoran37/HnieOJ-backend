hnieoj:
  # 基础设施连接信息只保留环境变量占位，真实密码和 Token 不要提交到仓库。
  # Docker Compose 部署时，这些变量来自 deploy/docker/.env；其他部署方式请在服务启动环境中注入。
  mysql:
    # 容器访问宿主机 MySQL 可使用 host.docker.internal；生产建议填写内网 IP 或数据库域名。
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    username: ${MYSQL_USERNAME:root}
    # 必须在真实部署前替换，不要继续使用 replace_me。
    password: ${MYSQL_PASSWORD:replace_me}
  redis:
    # Redis 如果没有密码，可将 REDIS_PASSWORD 置空；生产建议开启认证并限制内网访问。
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:replace_me}
  internal:
    # 服务间内部调用令牌，所有后端服务必须保持一致；请使用高强度随机值。
    token: ${HNIEOJ_INTERNAL_TOKEN:replace_me}
  rabbitmq:
    # 使用 deploy-dev.sh rabbitmq-up 启动项目自带 RabbitMQ 时填写 rabbitmq。
    # 使用外部 RabbitMQ 时填写内网 IP 或域名，并确保 vhost、账号、密码已提前创建。
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hnieoj_judge}
    password: ${RABBITMQ_PASSWORD:replace_me}
    virtual-host: ${RABBITMQ_VHOST:hnieoj}
