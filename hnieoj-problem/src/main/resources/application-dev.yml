server:
  port: ${SERVER_PORT:8102}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/hnieoj_problem_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

hnieoj:
  problem:
    storage:
      max-image-size: ${HNIEOJ_PROBLEM_MAX_IMAGE_SIZE:5MB}
      allowed-image-extensions: ${HNIEOJ_PROBLEM_ALLOWED_IMAGE_EXTENSIONS:jpg,jpeg,png,gif,webp}
      allowed-image-content-types: ${HNIEOJ_PROBLEM_ALLOWED_IMAGE_CONTENT_TYPES:image/jpeg,image/png,image/gif,image/webp}
    judge-asset:
      max-checker-bytes: ${HNIEOJ_PROBLEM_MAX_CHECKER_BYTES:262144}
      max-interactor-bytes: ${HNIEOJ_PROBLEM_MAX_INTERACTOR_BYTES:262144}
