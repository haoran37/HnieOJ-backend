# 合并上下文启动测试使用哑元基础设施配置，不连接真实 MySQL/Redis/RabbitMQ。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 显式短超时 + Druid 有界等待，避免哑元端口不可达时无限阻塞启动线程。
    url: jdbc:mysql://127.0.0.1:13306/hnieoj_judge_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&connectTimeout=2000&socketTimeout=3000
    username: root
    password: ""
    druid:
      max-wait: 2000
      connect-timeout: 2000
      break-after-acquire-failure: true
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: ""
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: hnieoj_judge
    password: ""
    virtual-host: hnieoj
    # 关闭 RabbitAdmin 自动声明，避免启动阶段尝试连接 MQ
    dynamic: false
    listener:
      simple:
        auto-startup: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer

hnieoj:
  judge:
    security:
      jwt-secret: test_judge_jwt_secret_value
      node-active-timeout-seconds: 90
    formal-token:
      public-key-path: /tmp/hnieoj-test/judge_formal_public.pem
