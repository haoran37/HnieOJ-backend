services:
  go-judge-sandbox:
    image: ${GOJUDGE_IMAGE:-hnieoj/go-judge:dev}
    build:
      context: ${GOJUDGE_SOURCE_DIR:?GOJUDGE_SOURCE_DIR is required}
      dockerfile: Dockerfile.hnieoj
    restart: unless-stopped
    privileged: true
    shm_size: ${GOJUDGE_SHM_SIZE:-512m}
    command:
      - /usr/local/bin/go-judge
      - -http-addr=:5050
      - -mount-conf=/opt/go-judge/mount.yaml
    # 沙箱是未认证的特权执行环境，只允许内网判题节点访问（go-judge-sandbox:5050），
    # 默认不向宿主机发布端口；本地调试请使用同级 go-judge 仓库的显式回环绑定脚本。
    networks:
      - hnieoj-backend

  hnieoj-judge-node:
    image: ${GOJUDGE_IMAGE:-hnieoj/go-judge:dev}
    restart: unless-stopped
    environment:
      # 节点只访问后端 HTTPS 与本地沙箱：不连接 Redis/Nacos/RabbitMQ，也不持有共享主密钥。
      # 环境变量名以同级 go-judge 当前源码为准（internal/hnieoj/config/config.go）。
      HNIEOJ_BASE_URL: ${HNIEOJ_BASE_URL:-https://oj.example.com}
      HNIEOJ_CREDENTIAL_TOKEN_FILE: ${HNIEOJ_CREDENTIAL_TOKEN_FILE:-/etc/hnieoj/judge-node/credential.json}
    command:
      - /usr/local/bin/hnieoj-judge-node
      - -config
      - /etc/hnieoj/go-judge/config.yaml
    volumes:
      - ${GOJUDGE_CONFIG_HOST_FILE:-/etc/hnieoj/go-judge/config.yaml}:/etc/hnieoj/go-judge/config.yaml:ro
      # 凭证必须挂载为可写目录（宿主 0700）：续期成功后节点以 0600 原子替换目录内的 credential.json。
      # 只读或可写的单文件 bind 都不行，rename 会替换 inode 且单文件挂载点无法被原子替换。
      - ${HNIEOJ_JUDGE_CREDENTIAL_HOST_DIR:-/etc/hnieoj/judge-node}:/etc/hnieoj/judge-node:rw
      - ${GOJUDGE_CACHE_DIR:-/data/oj/judge-cache}:/data/oj/judge-cache
    networks:
      - hnieoj-backend

networks:
  hnieoj-backend:
    driver: bridge
