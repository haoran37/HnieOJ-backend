spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${hnieoj.mysql.host}:${hnieoj.mysql.port}/hnieoj_system_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${hnieoj.mysql.username}
    password: ${hnieoj.mysql.password}
  data:
    redis:
      host: ${hnieoj.redis.host}
      port: ${hnieoj.redis.port}
      password: ${hnieoj.redis.password}

sa-token:
  is-print: false