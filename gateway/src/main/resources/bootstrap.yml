spring:
  application:
    name: gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:106.54.177.244:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
  config:
    import:
      - optional:nacos:hnieoj-secrets.yaml?group=HNIEOJ_SECRET_GROUP
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP
