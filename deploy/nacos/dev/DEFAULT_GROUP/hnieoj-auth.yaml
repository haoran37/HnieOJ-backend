spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${hnieoj.mysql.host}:${hnieoj.mysql.port}/hnieoj_user_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      username: ${hnieoj.mysql.username}
      password: ${hnieoj.mysql.password}
  data:
    redis:
      host: ${hnieoj.redis.host}
      port: ${hnieoj.redis.port}
      password: ${hnieoj.redis.password}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hnieacm.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  is-concurrent: true
  is-share: true
  is-print: false

hnieoj:
  auth-cache:
    # 登录后写入角色/权限缓存。jitter 用于错开缓存过期时间，避免同一时间大量请求回源。
    ttl:
      roles: 24h
      permissions: 12h
      empty: 5m
      jitter: 10m
  auth:
    validation:
      # 注册与登录入口的账号密码基础校验，前端校验规则应与这里保持一致。
      username-min-length: 2
      username-max-length: 20
      password-min-length: 6
      password-max-length: 32
