# HnieOJ-backend CI：编译 + 单元测试（ubuntu/windows 矩阵）、MySQL8/Redis7.4 集成回归、
# 阿里巴巴 P3C 规约静态检查、密钥泄漏扫描、依赖成分审查。
# 触发：push 到 master/dev，以及指向 master/dev 的 PR（fork PR 读取基线分支上的本文件）。
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 集成测试默认被 surefire 排除（**/integration/**），此处仅编译 + 单元测试
      - name: Build and run unit tests
        run: mvn -B -ntp package

  integration-tests:
    name: integration tests (MySQL 8 + Redis 7.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: hnieoj-local-test-only
          TZ: Asia/Shanghai
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -phnieoj-local-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7.4
        ports:
          - 26379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 端口与凭证与集成测试默认值一致（it.mysql.* 系统属性可覆盖），时区与迁移文档要求统一为 Asia/Shanghai
      - name: Run integration tests (mvn -Dit.enabled=true)
        env:
          TZ: Asia/Shanghai
        run: mvn -B -ntp -Dit.enabled=true package

  p3c:
    name: Alibaba P3C static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # p3c profile 将 PMD 检查绑定在 verify 阶段，存量违规见 .ci/pmd-baseline-exclude.txt
      - name: PMD P3C check
        run: mvn -B -ntp -Pp3c -DskipTests verify

      - name: Upload PMD reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pmd-reports
          path: '**/target/pmd.xml'
          if-no-files-found: ignore

  gitleaks:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/dependency-review-action@38ecb5b593bf0eb19e335c03f97670f792489a8b # v4.7.0
